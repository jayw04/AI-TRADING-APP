[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-workbench"
version = "0.0.1"
description = "Trading Workbench state MCP server (read-only tools for Claude Code / Desktop)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jay Wang" }]
dependencies = [
    # PINNED EXACTLY. `mcp 2.0.0` (released 2026-07-28) moved/removed `mcp.server.fastmcp`,
    # which src/mcp_workbench/server.py imports. The previous `mcp>=1.0` had no upper bound, so
    # a fresh CI install resolved the major bump and every Python FULL job failed at collection
    # with `ModuleNotFoundError: No module named 'mcp.server.fastmcp'` — main went red between
    # run 30347327373 (green, mcp 1.28.1) and run 30380598586 (red, mcp 2.0.0), ~7 hours apart.
    # 1.28.1 is the exact version from the last green run, not a guess from release dates.
    # Keep this identical to apps/mcp-server. Moving to 2.x needs a port of the FastMCP
    # import surface and its own PR.
    "mcp==1.28.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "anyio>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-httpx>=0.30",
]

[project.scripts]
mcp-workbench = "mcp_workbench.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
